version: 1
source_note: '화장품 안전기준 등에 관한 규정, 식품의약품안전처고시 제2024-9호 (2024.2.7. 시행). 원문 PDF (HWP→PDF): https://ysiet.com/info/download.php?fname=ac1.pdf
  (국가법령정보센터 원본: https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000236290). 주의: 이 파일 작성일(2026-09-22) 기준 최신 버전은 식품의약품안전처고시
  제2026-19호(2026.3.18. 시행)임. 2026-19호 주요 개정: 별표2에 자외선차단 성분 1종 추가 지정 (별표1 변경 없음 확인). 본 파일의 별표1 데이터는 2024-9호 기준이며, 2023~2024년
  개정사항(별표1 추가 12종)은 수동으로 보완함.'
retrieved: '2026-09-22'
completeness: '별표1(사용할 수 없는 원료): PDF 직접 파싱 606개 + 수동 보완 = 626개(미녹시딜·두타스테리드 2건은 고시 제2026-19호 원문 근거로 추가). 규정상 원료명 기준 약 680개 그룹 추정(CAS 수 기준 약 1,291개). 데이터 무결성(2026-09-22 실측): 626건 중 47건(7.5%)의 한글 원료명이 HWP→PDF 변환에서 잘린 꼬리 조각이며 (예: ''단)'', ''콜)'', ''로서0.1%이하인경우는제외)''), 모두 name_corrupted: true / verified: false로 표시하고 이름 조회에서 제외했습니다 — CAS로는 여전히 조회됩니다. 이 중 10건은 잘려나간 텍스트에 예외·조건 조항이 들어 있어 원 금지 조항이 조건부임을 시사합니다. 조회 키 보유 현황: SMILES 15건(전체의 2%), CAS 619건, 영문명 62건. 구조식이 거의 없으므로 SMILES나 영문명만으로 조회했을 때의 ''목록에 없음''은 무해함의 증명이 아니라 대조 키가 없었다는 뜻입니다. 나머지 579건의 verified: true는 원문 대조가 아니라 파싱 성공을 뜻하므로 그대로 신뢰해서는 안 됩니다. 별표2(사용상의 제한이 필요한 원료): 보존제 위주 29개 + 고시 제2026-16호 추가분 1개(페닐렌 비스-디페닐트리아진 5%, verified: false) = 30개. 별표2의 자외선차단 성분(현행 32종) 전체와 염모제 성분 등은 여전히 이 파일에 누락되어 있습니다.'
