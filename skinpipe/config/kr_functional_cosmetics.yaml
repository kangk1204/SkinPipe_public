claim_traps:
- trap_ko: 발모 / 육모 / 양모
  category: hair_loss
  why_ko: 새로운 모발 생성·성장 유도를 시사하여 의약품 영역으로 인식됨. 화장품은 탈모 '증상 완화' 수준만 허용.
  safer_ko: 탈모 증상의 완화에 도움을 줍니다
  source_url: https://www.cosmorning.com/news/article.html?no=49100
- trap_ko: 탈모 치료 / 탈모 예방 / 탈모 방지
  category: hair_loss
  why_ko: 치료·예방 표현은 의약품 효능 암시. 식약처 단속 적발 대표 표현.
  safer_ko: 탈모 증상의 완화에 도움을 줍니다
  source_url: https://www.cosmorning.com/news/article.html?no=49100
- trap_ko: DHT 억제 / 5α-환원효소 억제
  category: hair_loss
  why_ko: 호르몬 억제 메커니즘을 직접 표방하는 것은 의약품(피나스테리드·두타스테리드) 작용기전을 암시. 화장품 정의('인체에 대한 작용이
    경미한 것')를 벗어남.
  safer_ko: 두피 환경 개선에 도움을 줍니다 / 탈모 증상의 완화에 도움을 줍니다
  source_url: https://www.cosmorning.com/news/article.html?no=49100
- trap_ko: 모발 굵기 증가 / 모발 성장 촉진
  category: hair_loss
  why_ko: 모발 두께나 성장 자체를 변화시킨다는 주장은 의약품 영역.
  safer_ko: 탈모 증상의 완화에 도움을 줍니다
  source_url: https://www.cosmorning.com/news/article.html?no=49100
- trap_ko: 아토피 치료 / 습진 치료 / 피부 질환 치료
  category: skin_barrier
  why_ko: 질환(disease) 치료를 명시하면 의약품 영역. 피부장벽 기능성화장품은 '가려움 개선에 도움' 수준으로 한정.
  safer_ko: 피부장벽의 기능을 회복하여 가려움 등의 개선에 도움을 줍니다
  source_url: https://www.mfds.go.kr
- trap_ko: 미백 효과 (광고 문구로 단독 사용)
  category: whitening
  why_ko: '''미백 효과''라는 표현은 기능성화장품 심사 미이행 시 표시·광고 금지. 반드시 ''미백에 도움을 줍니다''로 한정.'
  safer_ko: 피부의 미백에 도움을 줍니다
  source_url: https://www.mfds.go.kr
routes:
- key: report
  ko: 보고 (심사 제외 품목 보고)
  when_ko: "다음 세 가지 경우에 한하여 심사 없이 보고만으로 유통 가능: 제1호(1호 보고) — 성분·함량·효능·용법·용량·기준 및 시험방법이\n\
    \  별표 4 고시 기준과 동일한 품목;\n제2호(2호 보고) — 이미 심사를 받은 타 품목과 모든 항목이 동일한 경우; 제3호(3호 보고)\
    \ — 심사받은 성분과 고시 성분이 혼합된 경우.\n"
  requirements_ko:
  - 기능성화장품 심사 제외 품목 보고서 제출 (의약품안전나라 온라인)
  - '성분·함량이 별표 4와 정확히 일치해야 함 (미백 제형: 로션제·액제·크림제·침적마스크로 제한)'
  - 별표 4에 지정된 효능·효과·용법·용량 문구 그대로 사용
  - '기준 및 시험방법: 고시 기준 적용'
  typical_duration_ko: '보고 접수 후 서류 요건 충족 시 사실상 즉시(수일 내) 처리 가능. 공식 처리기간 미공표(확인 필요).

    '
  advantages_ko: '심사비용·심사기간 없이 사용 가능. 신원료 임상 없이도 신제품 출시 가능. 고시원료 범위 내 배합비 조정은 자유(단
    농도 범위 이탈 불가).

    '
- key: review
  ko: 심사 (기능성화장품 전면 심사)
  when_ko: '고시원료 외의 신원료 사용, 고시 농도 범위 이탈, 피부장벽·튼살 등 고시원료 미지정 카테고리 진입 시 의무.

    '
  requirements_ko:
  - 기원 및 개발경위 자료
  - '안전성 자료: GLP 준수 독성시험(급성독성·피부자극·안자극 등), 「비임상시험관리기준」 적용'
  - '유효성 자료: 효력시험(in vitro/in vivo) 또는 인체적용시험(Human Clinical Trial) — 인체적용시험 제출 시
    효력시험 면제 가능'
  - 기준 및 시험방법 자료 (검체 포함)
  - '자외선차단제 추가: SPF·내수성차단지수·자외선A차단등급(PA) 설정 근거 자료'
  typical_duration_ko: '공식 처리기간: 60일 (화장품법 시행규칙 제9조, NIFDS 확인). 실무상 서류 보완 요청이 반복될
    경우 6~18개월 소요되는 경우도 보고됨. 인체적용시험(Human trial) 자체 설계·수행 기간(통상 3~6개월 이상) 별도.

    '
  disadvantages_ko: '신원료의 경우 인체적용시험 포함 총 소요기간 1~3년, 비용 수억 원 수준이 일반적. 고시 확대(새 원료를 별표
    4에 등재) 추진 시 별도 행정예고 절차 필요.

    '
  source_url: https://www.nifds.go.kr/brd/m_480/view.do?seq=12906
