  type: combination_notified
  note_ko: '출처 정정: 이 조합은 「기능성화장품 심사에 관한 규정」 별표 4에서 온 것이 아니다. 별표 4에는 탈모 섹션이 없으며 여섯 섹션(자외선차단·태닝, 미백, 주름개선, 모발색상변화, 체모제거, 여드름)뿐이다. 「기능성화장품 기준 및 시험방법」 별표 9(고시 제2025-89호)에는 덱스판테놀·비오틴·엘-멘톨·징크피리치온·징크피리치온 액(50%) 다섯 건의 원료 규격(성상·확인시험·순도시험·정량법)만 있고 완제품 배합 농도는 없다. 따라서 아래 농도에는 1차 출처가 없으며, 업계 기사에 유통되는 수치일 뿐이다. 파이프라인 판단에 직접 쓰지 말 것.'
