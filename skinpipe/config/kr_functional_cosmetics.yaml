- category: hair_loss
  type: combination_notified
  note_ko: '출처 정정: 이 조합은 「기능성화장품 심사에 관한 규정」 별표 4에서 온 것이 아니다. 별표 4에는 탈모 섹션이 없으며 여섯 섹션(자외선차단·태닝, 미백, 주름개선, 모발색상변화, 체모제거, 여드름)뿐이다. 「기능성화장품 기준 및 시험방법」 별표 9(고시 제2025-89호)에는 덱스판테놀·비오틴·엘-멘톨·징크피리치온·징크피리치온 액(50%) 다섯 건의 원료 규격(성상·확인시험·순도시험·정량법)만 있고 완제품 배합 농도는 없다. 따라서 아래 농도에는 1차 출처가 없으며, 업계 기사에 유통되는 수치일 뿐이다. 파이프라인 판단에 직접 쓰지 말 것.'
  ko: 복합제 조합 1
  combination_ko:
  - ingredient: 덱스판테놀 (Dexpanthenol)
    concentration: 0.2%
    concentration_note: 일부 출처에서 0.1%로 기재되는 경우 있음. 공식 고시 원문 재확인 필요.
  - ingredient: 살리실릭애씨드 (Salicylic Acid)
    concentration: 0.25%
  - ingredient: 엘-멘톨 (l-Menthol)
    concentration: 0.3%
  verified: false
  uncertainty_note: '덱스판테놀 농도에 대해 cosmorning(0.2%)과 경향신문·하이닥(0.1%) 간 불일치 발생. 공식 고시
    원문(식약처 고시 또는 의약품안전나라)을 직접 확인하여 해소할 것. 이 수치를 파이프라인에 직접 사용하지 말 것.

    '
  source_url: https://www.cosmorning.com/news/article.html?no=38072
