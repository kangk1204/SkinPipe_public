version: 1
source_note: '주요 출처: 「기능성화장품 심사에 관한 규정」 [별표 4], 현행본 = 식품의약품안전처고시 제2025-88호
  (2025.12.16. 일부개정·시행). 이전에 이 파일이 인용하던 law.go.kr flSeq=133405543 은 제2023-61호 판본으로
  폐지·대체되었음(그 판본에는 과산화수소 12.0%와 제2025-88호가 삭제한 염모제 성분 12종이 남아 있어 현행이 아님을
  식별할 수 있음). 제2025-88호 개정으로 미백·주름개선 제형에 ''고형제''가, 여드름 제형에도 ''고형제''가 추가됨.
  보조 출처: 「기능성화장품 기준 및 시험방법」 [별표 9] = 고시 제2025-89호 (law.go.kr flSeq=160450231,
  2026-09-22 취득), MFDS 기능성화장품 심사를 위한 질의응답집(민원인 안내서) 2023.12, 화장품법 시행규칙 제2조
  [시행 2026.4.2., 총리령 제2109호].

  두 목록을 혼동하지 말 것: 이 파일의 uv_protection notified_ingredients 27종은 「기능성화장품 심사에 관한 규정」
  별표 4의 ''자료제출을 생략할 수 있는'' 성분, 즉 보고 루트용 목록이다. 화장품에 배합 자체가 허용되는 자외선차단
  성분 목록은 「화장품 안전기준 등에 관한 규정」 [별표 2]로 별개이며, 고시 제2026-16호가 페닐렌 비스-디페닐트리아진
  (5%)을 추가해 현행 32종이다. 이 27종을 ''한국의 자외선차단 성분''으로 읽으면 안 된다.

  별표 4의 최신 개정 여부는 law.go.kr 원문을 항상 재확인할 것.

  '
retrieved: '2026-09-22'
categories:
- key: whitening
  ko: 피부의 미백에 도움을 주는 제품
  statutory_items_ko:
  - '1호: 피부에 멜라닌색소가 침착하는 것을 방지하여 기미·주근깨 등의 생성을 억제함으로써 피부의 미백에 도움을 주는 기능을 가진 화장품'
  - '2호: 피부에 침착된 멜라닌색소의 색을 엷게 하여 피부의 미백에 도움을 주는 기능을 가진 화장품'
  claim_examples_ko:
  - 피부의 미백에 도움을 줍니다
  product_restriction_ko: '별표 4(고시 제2025-88호) 원문: 제형은 로션제, 액제, 크림제, 고형제 및 침적 마스크에 한하며. 고형제는 제2025-88호 개정으로 추가됨'
  notes_ko: '고시원료 9종이 지정되어 있음. 이 범위 내 성분·함량·제형을 사용하면 보고(제1호) 루트 가능. 히드로퀴논(하이드로퀴논)은
    한국에서 화장품 배합 금지 성분이므로 미백 원료로 사용 불가. 2022년 개정으로 알부틴·아데노신 침적 마스크 제형 기준 추가 및 히드로퀴논
    시험항목 신설.

    '
- key: anti_wrinkle
  ko: 피부의 주름개선에 도움을 주는 제품
  statutory_items_ko:
  - '3호: 피부에 탄력을 주어 피부의 주름을 완화 또는 개선하는 기능을 가진 화장품'
  claim_examples_ko:
  - 피부의 주름개선에 도움을 줍니다
  product_restriction_ko: '별표 4(고시 제2025-88호) 원문: 제형은 로션제, 액제, 크림제, 고형제 및 침적 마스크에 한하며. 고형제는 제2025-88호 개정으로 추가됨'
  notes_ko: '고시원료 4종. 레티놀·레티닐팔미테이트는 IU/g 단위로 규정됨(mg/g 아님). 아데노신 0.04%는 주름개선 전용 고시원료이지,
    미백 원료가 아님(Discovery pipeline이 자주 혼동).

    '
- key: uv_protection
  ko: 자외선으로부터 피부를 보호하거나 곱게 태워주는 기능을 주는 제품
  statutory_items_ko:
  - '4호: 강한 햇볕을 방지하여 피부를 곱게 태워주는 기능을 가진 화장품'
  - '5호: 자외선을 차단 또는 산란시켜 자외선으로부터 피부를 보호하는 기능을 가진 화장품'
  claim_examples_ko:
  - 자외선으로부터 피부를 보호합니다
  - SPF○○, PA+++
  product_restriction_ko: '별표 4 고시: 영·유아용 제품류 중 로션·크림·오일, 기초화장용 제품류, 색조화장용 제품류에 한함'
  notes_ko: '별표 4에 29개 번호 중 1번·16번이 <삭 제>로 되어 있어 실질 27종의 자외선차단 필터가 허용됨. 징크옥사이드·티타늄디옥사이드는
    자외선차단 성분으로서 최대 25%로 규정(기타 용도로는 별도 배합한도 적용). EU나 미국에서 허가된 필터라도 이 목록에 없으면 별도 심사
    필요. 이 27종은 「기능성화장품 심사에 관한 규정」 별표 4의 ''자료제출 생략'' 목록(보고 루트용)이며, 화장품에 배합할 수 있는 자외선차단 성분
    목록은 「화장품 안전기준 등에 관한 규정」 별표 2로 별개다(고시 제2026-16호의 페닐렌 비스-디페닐트리아진 5% 추가로 현행 32종). 27종을
    ''한국의 자외선차단 성분''으로 읽지 말 것.

    '
- key: hair_loss
  ko: 탈모 증상의 완화에 도움을 주는 제품
  statutory_items_ko:
  - '8호: 탈모 증상의 완화에 도움을 주는 화장품. 다만, 코팅 등 물리적으로 모발을 굵게 보이게 하는 제품은 제외한다.'
  claim_examples_ko:
  - 탈모 증상의 완화에 도움을 줍니다
  product_restriction_ko: null
  notes_ko: '2017.05.30 의약외품에서 기능성화장품으로 재분류. 별표 9에 개별 원료(덱스판테놀·비오틴·엘-멘톨·징크피리치온) 규격이
    등재되어 있으나, 보고(심사 면제) 루트는 특정 조합 배합에만 적용됨(아래 notified_ingredients 참조). 미녹시딜·피나스테리드·두타스테리드는
    「화장품 안전기준 등에 관한 규정」 별표 1 사용금지 원료로 등재되어 있으므로, 화장품 배합 불가의 근거는 ''의약품이라서''가 아니라
    별표 1 statute다(각각 ''6-(피페리디닐)-2,4-피리미딘디아민-3-옥사이드(미녹시딜), 그 염류 및 유도체'', ''피나스테리드, 그 염류 및
    유도체'', ''두타스테리드, 그 염류 및 유도체''). 발모·육모·양모·DHT 억제 등 표현은 의약품 오인 우려로 금지.

    '
- key: acne
  ko: 여드름성 피부를 완화하는 데 도움을 주는 제품
  statutory_items_ko:
  - '9호: 여드름성 피부를 완화하는 데 도움을 주는 화장품. 다만, 인체세정용 제품류로 한정한다.'
  claim_examples_ko:
  - 여드름성 피부를 완화하는 데 도움을 줍니다
  product_restriction_ko: '유형은 인체세정용 제품류(비누조성의 제제)로 한정 — 화장품법 시행규칙 제2조제9호 [시행 2026.4.2., 총리령 제2109호] 및 별표 4 §6. 제형은 별표 4(고시 제2025-88호) 원문으로 로션제, 액제, 크림제, 고형제에 한함(부직포 등에 침적된 상태는 제외함). 고형제는 제2025-88호 개정으로 추가됨. 앰플·크림·세럼류는 여드름 기능성 주장 불가.'
  notes_ko: '살리실릭애씨드 0.5% 단독 고시원료 1종. 배합한도 고시에서 살리실릭애씨드는 기능성 목적 외에도 보존제 용도로 0.5% 이하
    사용 가능하나, 기능성 클레임을 내려면 반드시 심사 또는 고시 보고 루트를 밟아야 하며 제형을 인체세정용으로 제한해야 함.

    '
- key: hair_color
  ko: 모발의 색상을 변화시키는 기능을 가진 화장품
  statutory_items_ko:
  - '6호: 모발의 색상을 변화[탈염·탈색을 포함한다]시키는 기능을 가진 화장품. 다만, 일시적으로 모발의 색상을 변화시키는 제품은 제외한다.'
  claim_examples_ko:
  - 모발의 색상을 변화시킵니다
  product_restriction_ko: 분말제, 액제, 크림제, 로션제, 에어로졸제, 겔제에 한함
  notes_ko: '별표 4에 산화염모제, 비산화염모제, 탈색제, 산화제 등의 성분 목록이 있음. 산화염모 성분만 수십 종으로 본 파이프라인 범위(바이오마커
    분석) 밖이므로 상세 목록 생략.

    '
- key: hair_removal
  ko: 체모를 제거하는 기능을 가진 화장품
  statutory_items_ko:
  - '7호: 체모를 제거하는 기능을 가진 화장품. 다만, 물리적으로 체모를 제거하는 제품은 제외한다.'
  claim_examples_ko:
  - 체모를 제거합니다
  product_restriction_ko: null
  notes_ko: '고시원료: 치오글리콜산 80% 기준 3.0~4.5%. 본 파이프라인 범위 외.'
- key: skin_barrier
  ko: 피부장벽의 기능을 회복하여 가려움 등의 개선에 도움을 주는 화장품
  statutory_items_ko:
  - '10호: 피부장벽(피부의 가장 바깥 쪽에 존재하는 각질층의 표피를 말한다)의 기능을 회복하여 가려움 등의 개선에 도움을 주는 화장품'
  claim_examples_ko:
  - 피부장벽의 기능을 회복하여 가려움 등의 개선에 도움을 줍니다
  product_restriction_ko: null
  notes_ko: '2017.05.30 기능성화장품으로 신규 추가. 고시원료 없음 — 모든 품목이 심사(전면심사) 대상. 식약처에서 인체적용시험
    가이드라인만 별도 제정·안내. Discovery pipeline에서 신원료를 제안하는 경우 반드시 심사 루트.

    '
- key: stretch_marks
  ko: 튼살로 인한 붉은 선을 엷게 하는 데 도움을 주는 화장품
  statutory_items_ko:
  - '11호: 튼살로 인한 붉은 선을 엷게 하는 데 도움을 주는 화장품'
  claim_examples_ko:
  - 튼살로 인한 붉은 선을 엷게 하는 데 도움을 줍니다
  product_restriction_ko: null
  notes_ko: '2017.05.30 기능성화장품으로 신규 추가. 고시원료 없음 — 모든 품목이 심사 대상.

    '
