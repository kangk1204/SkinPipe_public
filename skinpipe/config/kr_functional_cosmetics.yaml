  note_ko: '표기 정정: 고시 원문 표기는 히드로퀴논이며 하이드로퀴논은 업계 표기다(고시 원문 검색 시 하이드로퀴논은 0건).
    이름 조회가 부분일치에서 정규화 후 완전일치로 바뀌었으므로 1차 표기가 틀리면 누락이 발생한다. 업계 표기는 aliases로 보존한다.'
  source_url: https://www.k-health.com/news/articleView.html?idxno=43642
