[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinpipe"
version = "0.3.0rc1"
description = "Skin-targeted small-molecule discovery pipeline: biomarker triage, provenance-checked bioactivity, topical filtering, docking and MM/GBSA"
requires-python = ">=3.10,<3.13"
dependencies = [
  "rdkit", "requests", "pandas", "numpy", "pyyaml", "typer", "rich", "tqdm",
  # structure/mmcif.py and structure/box.py import it (deferred, inside the
  # function, like openmm) but nothing declared it, so an install made strictly
  # from this file lost mmCIF parsing and the UniProt binding-site box with a
  # bare ModuleNotFoundError. Core, not an extra: those two paths belong to
  # structure handling, which `docking` and `mmgbsa` both sit on top of.
  "biopython",
  "ijson>=3.4,<4",  # bounded saved-parent selection from full scientific JSON
]

[project.optional-dependencies]
chatgpt = ["PyJWT[crypto]>=2.10,<3"]
# Meeko intentionally leaves Requires-Dist empty on PyPI. Its import graph
# needs scipy and gemmi; rdkit/numpy/tqdm are already declared in core.
docking = ["vina", "meeko", "scipy", "gemmi", "tomli; python_version < '3.11'"]
# The complete MM/GBSA stack requires conda-forge packages. Install
# environment-mmgbsa.yml first; this extra verifies those installed dependencies.
# A plain PyPI-only `pip install skinpipe[mmgbsa]` cannot provide OpenFF Toolkit.
mmgbsa  = ["openmm", "pdbfixer", "openmmforcefields", "openff-toolkit"]
dev     = ["pytest", "pytest-cov", "ruff==0.14.7", "build", "setuptools>=68", "wheel"]
platform = ["duckdb>=1.5,<2", "psycopg[binary]>=3.3,<4", "openpyxl>=3.1,<4", "Pillow>=10,<13", "scikit-learn>=1.5,<2"]
research = ["duckdb>=1.5,<2", "psycopg[binary]>=3.3,<4", "openpyxl>=3.1,<4", "Pillow>=10,<13", "scikit-learn>=1.5,<2", "meeko==0.8.0", "scipy", "gemmi", "posebusters==0.6.5", "PyJWT[crypto]>=2.10,<3"]
catalog-build = ["rdkit==2025.9.5", "openpyxl>=3.1,<4"]
catalog-index = ["FPSim2==0.7.4", "pyarrow==23.0.1", "duckdb>=1.5,<2"]
algorithms-chemistry = ["dimorphite-dl==2.1.0", "CDPKit==1.3.0", "FPSim2==0.7.4", "posebusters==0.6.5", "prolif==2.2.2", "MDAnalysis==2.10.0"]
algorithms-evaluation = ["chemprop==2.3.1", "MAPIE==1.5.0", "botorch==0.18.1"]

[project.scripts]
skinpipe = "skinpipe.cli:main"
skinpipe-platform = "skinpipe.platform.cli:main"
skinpipe-literature = "skinpipe.literature.cli:main"
skinpipe-research = "skinpipe.platform.personal_local:main"
skinpipe-database = "skinpipe.platform.database_bundle:main"
skinpipe-catalog = "skinpipe.platform.catalog_bootstrap:main"

# `config/` sits beside the package, not inside it, and registry.py reaches it
# with `Path(__file__).parent.parent / "config"`. Without `namespaces` it is not
# a package, so nothing under it shipped: the wheel built cleanly and every
# entry point died on a missing skin_targets.yaml the first time it ran outside
# an editable install. (The tidier fix is to move config/ inside the package,
# which needs matching path changes in eligibility.py and regulatory.py.)
[tool.setuptools.packages.find]
include = ["skinpipe*", "config*"]
namespaces = true

[tool.setuptools.package-data]
# `*.json` is here for `config/structure_weight_overrides.json`, which decides
# whether a node's docking term reaches its ranking. Left out, a wheel install
# ranked differently from a source checkout and said nothing: the file is
# optional by design, so `score.structure_override` returns None when it is
# missing and falls back to the default 0.15. That is correct for a user who
# never wrote a policy and wrong for a packaging bug, and the two were
# indistinguishable.
"*" = ["*.yaml", "*.md", "*.json"]
"skinpipe.platform" = ["_export_assets/**/*", "_catalog_assets/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests", "scripts"]
markers = [
  "network: hits external APIs",
  "local_network: exercises a literal loopback HTTP fixture while external HTTP stays blocked",
  "slow: takes more than ~30 s",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Mandatory Ruff defaults, explicit for the pinned developer and CI checks.
select = ["E4", "E7", "E9", "F"]
