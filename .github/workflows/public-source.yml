name: Public platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check-public-tree.py
      - run: node tests/test_metric_radar.mjs
      - run: node tests/test_research_progress.mjs
      - run: node tests/test_research_export_state.mjs
      - name: Check all browser module syntax
        run: |
          for module in web/public/*.js; do node --check "$module"; done
      - run: python -m unittest discover -s tests -p test_public_install.py -v
      - run: python -m compileall -q skinpipe/skinpipe
      - run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/skinpipe-wheel" ./skinpipe
      - run: python scripts/check-public-tree.py --package "$RUNNER_TEMP"/skinpipe-wheel/*.whl
  runtime-regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONPATH: skinpipe
      SKINPIPE_RUNTIME_AUDIT_DSN: postgresql://skinpipe_test:isolated_ci_only@127.0.0.1:5432/skinpipe_test
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Start pinned PostgreSQL with registry fallback
        shell: bash
        run: |
          set -euo pipefail
          postgres_digest=sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          for registry in public.ecr.aws/docker/library docker.io/library; do
            image_ref="$registry/postgres:17@$postgres_digest"
            if docker pull "$image_ref"; then
              docker tag "$image_ref" skinpipe-test-postgres:ci
              break
            fi
          done
          docker image inspect skinpipe-test-postgres:ci >/dev/null
          docker run --detach --name skinpipe-test-postgres \
            --env POSTGRES_USER=skinpipe_test \
            --env POSTGRES_PASSWORD=isolated_ci_only \
            --env POSTGRES_DB=skinpipe_test \
            --publish 127.0.0.1:5432:5432 \
            --health-cmd 'pg_isready -U skinpipe_test' \
            --health-interval 1s --health-timeout 5s --health-retries 20 \
            skinpipe-test-postgres:ci
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' skinpipe-test-postgres)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs skinpipe-test-postgres
          exit 1
      - run: python -m pip install './skinpipe[dev,platform,docking]' 'pyarrow==23.0.1'
      - run: ruff check --no-cache --config skinpipe/pyproject.toml skinpipe tests
      - run: python -m pytest tests -ra --junitxml=regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-python-${{ matrix.python }}
          path: regression.xml
      - name: Stop isolated test database
        if: always()
        run: docker rm --force skinpipe-test-postgres || true
